syntax = "proto2";
option go_package = "./iwown";

import "realtime_data.proto";

message HisDataMedic {
    required    DateTime              time_stamp = 1;
    optional    fixed32               pain_level = 2;
    optional    fixed32               fatigue_level = 3;
    optional    fixed32               stiff_level = 4;
    optional    fixed32               stiff_time = 5;
}

