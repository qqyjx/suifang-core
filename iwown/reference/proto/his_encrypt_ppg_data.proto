syntax = "proto2";
option go_package = "./iwown";

import "realtime_data.proto";
import "his_ppg_data.proto";



message HisPPGEncrypt {
    required    HisDataPPG           ppgencrypt = 1;
    required    bytes                Random = 2;   //random number 
    required    bytes                BleMac  = 3;
}

message HisDataPPGEncrypt {
    required    HisPPGEncrypt        his_ppg  = 1;
    required    bytes                signature_data= 2;
}

