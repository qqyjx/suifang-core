# ============================================================
# 给六元运维同事: 在 dc.ncrc.org.cn 的 443 server 块里加这一段 location
# ============================================================
# 作用: 把外网 https://dc.ncrc.org.cn/iwown/*  反代到内网 iwown 接收服务
#       (192.168.4.104:8099), 和现有 /api2/ (S101) 并列, 互不影响。
#
# 加好后手表烧录地址只填前缀: https://dc.ncrc.org.cn/iwown  (⚠️ 不带 /pb/upload!)
# 手表内部自动拼 /pb/upload 等端点, 经此 location 反代; proxy_pass 末尾 / 把 /iwown
# 前缀剥掉, 服务收到的就是 /pb/upload。
# 多写 /pb/upload 会让手表实际发 /iwown/pb/upload/pb/upload → 服务 404, 数据进不来
# (2026-06-01 厂商确认 + 实测)。注意 search.iwown.com/connect4g 测试工具反而填完整路径。

location /iwown/ {
    proxy_pass http://192.168.4.104:8099/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 10m;
}

# 说明:
# 1. 不需要像 springboot 那样改 Content-Type。手表上报 Content-Type 写的是
#    application/x-www-form-urlencoded 但实为二进制, 本服务用 Python 原生
#    rfile 读原始字节, 不做表单解析, 所以无需 nginx 改写 Content-Type。
# 2. client_max_body_size 10m 与 /api2/ 一致, 手表单次上行通常很小, 足够。
# 3. 改完: nginx -t && nginx -s reload
